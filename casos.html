<style>
@font-face{font-family:"IS";font-style:normal;src:url("v2/fonts/instrument-serif.woff2") format("woff2")}
@font-face{font-family:"IS";font-style:italic;src:url("v2/fonts/instrument-serif-italic.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:400 600;src:url("v2/fonts/inter-var.woff2") format("woff2")}
:root{--ink:#070707;--paper:#f3efe6;--lime:#d7f24a;--mute:rgba(243,239,230,.58);--line:rgba(243,239,230,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
em{font-style:italic;color:var(--lime)}.serif{font-family:IS,serif;font-weight:400;letter-spacing:-.02em}
.tiny{font-size:.72vw;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.sec{position:relative;padding:6vw 6vw 5vw;overflow:hidden;min-height:100vh}
.glow{position:absolute;width:44vw;height:44vw;border-radius:50%;background:radial-gradient(circle,rgba(215,242,74,.30),rgba(215,242,74,.07) 42%,transparent 68%);pointer-events:none;z-index:0;right:-8vw;top:10vw;animation:dr 14s ease-in-out infinite alternate}
@keyframes dr{from{transform:translate3d(-6vw,3vw,0) scale(.92)}to{transform:translate3d(2vw,-3vw,0) scale(1.06)}}
.glass{position:relative;border-radius:1.2vw;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 45%,rgba(215,242,74,.05)),rgba(12,13,10,.6);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2.4vw 5vw rgba(0,0,0,.5)}
.head{position:relative;z-index:3;margin-bottom:2.4vw}.head h2{font-size:4.4vw;line-height:1}.head .tiny{display:block;margin-bottom:1vw}.head p{margin-top:1vw;font-size:1.1vw;color:var(--mute);max-width:46vw}
.btn{display:inline-flex;gap:.6vw;align-items:center;padding:.85vw 1.5vw;border-radius:99px;background:var(--lime);color:var(--ink);font-weight:500;font-size:.9vw}.btn.o{background:none;color:var(--paper);border:1px solid rgba(243,239,230,.35)}
.note{position:relative;z-index:3;margin-top:2.4vw;font-size:.75vw;color:rgba(243,239,230,.38);max-width:70vw}

/* bloques del marketplace */
.blocks{position:relative;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vw;margin-bottom:3vw}
.blk{padding:1.6vw 1.8vw 1.7vw;transition:.4s;overflow:hidden;min-height:10vw;display:flex;flex-direction:column;justify-content:space-between;gap:1.2vw}
.blk .ic{display:block;width:3.2vw;height:3.2vw;color:rgba(243,239,230,.45);transition:.4s}.blk .ic svg{width:100%;height:100%}
.blk b{display:block;font:400 2.1vw IS;line-height:1.05}
.blk div span{display:block;font-size:.85vw;color:var(--mute);margin-top:.5vw;line-height:1.4}
.blk::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--lime);transform:scaleX(0);transform-origin:left;transition:transform .5s}
.blk:hover{transform:translateY(-.3vw)}
.blk.on{border-color:rgba(215,242,74,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 2vw rgba(215,242,74,.2),0 2.4vw 5vw rgba(0,0,0,.5)}.blk.on .ic{color:var(--lime);filter:drop-shadow(0 0 .6vw rgba(215,242,74,.5))}.blk.on::after{transform:scaleX(1)}

.stage{position:relative;z-index:5}
.view{display:none}.view.on{display:block;animation:vin .6s backwards}
@keyframes vin{from{opacity:0;transform:translateY(1vw)}to{opacity:1;transform:none}}
.more{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;margin-top:3vw;padding-top:1.6vw;border-top:1px solid var(--line);font-size:1vw;color:var(--mute)}

/* servicios */
.svc3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vw}
.sv{padding:2vw 2vw 1.8vw;display:flex;flex-direction:column;gap:.8vw}.sv .k{font-size:.7vw;letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
.sv h3{font:400 2.4vw IS;line-height:1.05}.sv p{font-size:1vw;color:rgba(243,239,230,.85);line-height:1.45}
.sv ul{list-style:none;display:grid;gap:.5vw;margin:.6vw 0 1vw;padding-top:.9vw;border-top:1px solid rgba(215,242,74,.3)}.sv li{font-size:.92vw;color:var(--mute);padding-left:1vw;position:relative}.sv li::before{content:"";position:absolute;left:0;top:.5vw;width:.38vw;height:.38vw;border-radius:50%;background:var(--lime)}
.sv .btn{align-self:flex-start;margin-top:auto}.sv.rec{border-color:rgba(215,242,74,.6)}.sv .rb{position:absolute;top:1vw;right:1.2vw;font-size:.62vw;letter-spacing:.14em;text-transform:uppercase;background:var(--lime);color:var(--ink);padding:.3vw .7vw;border-radius:99px;font-weight:500}

/* trabajos: lista + medidor */
.gx{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 28vw;gap:5vw;align-items:center}
.gx-list{list-style:none;border-top:1px solid var(--line)}.gx-it{position:relative;border-bottom:1px solid var(--line)}
.gx-li{width:100%;display:grid;grid-template-columns:2vw minmax(0,1fr) auto;align-items:center;padding:1.25vw 0}
.gx-n{display:block;width:.42vw;height:.42vw;border-radius:50%;background:rgba(243,239,230,.28);transition:.4s}.gx-it.on .gx-n{background:var(--lime);box-shadow:0 0 0 .3vw rgba(215,242,74,.16)}
.gx-t{font:400 2.1vw IS;line-height:1.05;color:rgba(243,239,230,.32);transition:color .5s}.gx-it.on .gx-t,.gx-li:hover .gx-t{color:#fff}
.gx-g{font-size:.7vw;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.gx-bar{position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:var(--lime);transform:scaleX(0);transform-origin:left}.gx-it.on .gx-bar{animation:fill var(--t,6000ms) linear forwards}.gx.hold .gx-it.on .gx-bar{animation:none;transform:scaleX(1)}
@keyframes fill{to{transform:scaleX(1)}}
.gx-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s cubic-bezier(.2,.8,.2,1)}.gx-more>div{overflow:hidden;padding-left:2vw}.gx-it.on .gx-more{grid-template-rows:1fr}
.gx-p{margin:0 0 .3vw;font-size:1vw;line-height:1.5;color:rgba(243,239,230,.72);max-width:32vw}.gx-p b{display:block;font-size:.64vw;letter-spacing:.18em;text-transform:uppercase;color:var(--lime);font-weight:500;margin-bottom:.15vw}
.gx-more a{display:inline-flex;gap:.6vw;margin:.5vw 0 1.3vw;padding-bottom:.3vw;border-bottom:1px solid var(--lime);font-size:.78vw;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.dial{position:relative;width:28vw;aspect-ratio:1;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 36%,rgba(255,255,255,.07),transparent 62%),linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 45%,rgba(215,242,74,.05)),rgba(10,11,9,.5);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2vw 4vw rgba(0,0,0,.35),0 3vw 6vw rgba(0,0,0,.55)}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.tk line{stroke:rgba(243,239,230,.22);stroke-width:.5}.tk .M{stroke:rgba(243,239,230,.6);stroke-width:.9}
.a0,.a1,.a2{fill:none;stroke-linecap:round;stroke-dasharray:348.7 465}.a0{stroke:rgba(243,239,230,.1);stroke-width:3}.a1{stroke:var(--lime);stroke-width:3}.a2{stroke:rgba(215,242,74,.2);stroke-width:9}
.a1,.a2{stroke-dashoffset:348.7;transition:stroke-dashoffset 1.7s cubic-bezier(.25,0,.1,1)}
.ndl{position:absolute;left:50%;bottom:50%;width:.9%;height:37%;margin-left:-.45%;border-radius:99px;transform-origin:50% 100%;transform:rotate(-135deg);background:linear-gradient(0deg,rgba(255,255,255,.08),rgba(255,255,255,.92));box-shadow:0 0 1vw rgba(215,242,74,.45);transition:transform 1.7s cubic-bezier(.25,0,.1,1)}
.snap .ndl,.snap .a1,.snap .a2{transition:none!important}
.hub{position:absolute;left:50%;top:50%;width:6%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#fff,#9aa3a0 40%,#1d1f1c)}
.rd{position:absolute;left:26%;right:26%;bottom:8%;display:grid;justify-items:center;gap:.3vw;text-align:center}
.rd .v{white-space:nowrap;font:400 3.6vw IS;line-height:1;color:var(--lime);text-shadow:0 0 2vw rgba(215,242,74,.35);font-variant-numeric:tabular-nums}.rd .v.t{font-style:italic;font-size:3vw}
.rd .u{font-size:.58vw;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(243,239,230,.6)}.rd .ba{font-size:.7vw;color:rgba(243,239,230,.6);line-height:1.3}.rd .ba b{color:#fff;font-weight:500}

/* plataformas y sitios: dock + notebook */
.dock{display:flex;flex-wrap:wrap;gap:.9vw;margin-bottom:2.6vw}
.tile{padding:.8vw 1.2vw;border-radius:1vw;min-width:8vw;transition:.4s;cursor:pointer;position:relative;overflow:hidden}.tile span{display:block;font-size:.62vw;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}.tile b{display:block;font:400 1.25vw IS;margin-top:.25vw}
.tile.on{border-color:rgba(215,242,74,.7);box-shadow:0 0 2vw rgba(215,242,74,.22),inset 0 1px 0 rgba(255,255,255,.3);transform:translateY(-.3vw)}.tile.on::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--lime);transform-origin:left;animation:fill 5.4s linear forwards}
.main{display:grid;grid-template-columns:1.15fr 1fr;gap:5vw;align-items:center}
.mtag{font-size:.7vw;letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}.mname{font:400 3.2vw IS;line-height:1;margin:.6vw 0 .8vw}.mlead{font-size:1.12vw;color:rgba(243,239,230,.85);max-width:30vw;line-height:1.45}
.mlist{list-style:none;margin:1.2vw 0 1.5vw;display:grid;gap:.5vw}.mlist li{font-size:.95vw;color:var(--mute);padding-left:1.1vw;position:relative}.mlist li::before{content:"";position:absolute;left:0;top:.5vw;width:.4vw;height:.4vw;border-radius:50%;background:var(--lime)}
.acts{display:flex;gap:.8vw;flex-wrap:wrap}

/* pantallas simuladas */
.dev{position:relative;container-type:inline-size;width:100%}
.pwrap{container-type:inline-size;width:14vw;margin:0 auto}.phone{width:100%;aspect-ratio:9/19;border-radius:12cqw;padding:2.2cqw;background:#0b0c0b;border:1.5px solid #5a5c57;box-shadow:inset 0 0 0 .8cqw #1b1c1a,0 4vw 8vw rgba(0,0,0,.6),0 0 6vw rgba(215,242,74,.1);position:relative;margin:0 auto}.phone::before{content:"";position:absolute;left:50%;top:3.4cqw;width:24cqw;height:6.2cqw;margin-left:-12cqw;border-radius:9cqw;background:#050505;z-index:4}.phone .scr{border-radius:10.4cqw}
.lap{aspect-ratio:16/10;border-radius:2.4cqw 2.4cqw .5cqw .5cqw;padding:1.7cqw 1.5cqw 1.5cqw;background:#050505;border:1.5px solid #565852;border-bottom:0;margin-bottom:3.6cqw;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 0 6vw rgba(215,242,74,.1)}.lap::before{content:"";position:absolute;left:50%;top:.6cqw;width:.8cqw;height:.8cqw;margin-left:-.4cqw;border-radius:50%;background:#1a2a30;box-shadow:0 0 0 .22cqw #0d0f0e;z-index:3}
.lap::after{content:"";position:absolute;left:-7cqw;right:-7cqw;top:100%;height:3.6cqw;border-radius:0 0 4.5cqw 4.5cqw/0 0 2.2cqw 2.2cqw;background:linear-gradient(180deg,#6e706b,#6e706b) center top/16cqw 1.1cqw no-repeat,linear-gradient(180deg,#eceee8 0,#c3c6bf 24%,#989b95 68%,#5b5d58 100%);box-shadow:0 .5cqw 0 -.1cqw rgba(0,0,0,.4),0 3vw 5vw rgba(0,0,0,.6)}
.scr{width:100%;height:100%;border-radius:8cqw/4cqw;overflow:hidden;background:#0b0c0a;position:relative;container-type:inline-size;font-size:3.6cqw}.lap .scr{border-radius:.8cqw}
.m-h{display:flex;justify-content:space-between;align-items:center;padding:7cqw 6cqw 3cqw}.m-h b{font:500 5cqw Inter}.m-h span{font-size:3cqw;color:var(--lime);letter-spacing:.14em;text-transform:uppercase}
.m-card{margin:2cqw 5cqw;padding:5cqw;border-radius:5cqw;background:linear-gradient(135deg,rgba(215,242,74,.22),rgba(215,242,74,.05));border:1px solid rgba(215,242,74,.35)}.m-card i{font-style:normal;font-size:3cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}.m-card b{display:block;font:italic 400 8cqw IS;margin:1.5cqw 0 3cqw}
.m-bar{height:1.6cqw;border-radius:9cqw;background:rgba(255,255,255,.12);overflow:hidden}.m-bar u{display:block;height:100%;width:30%;background:var(--lime);transition:width .5s}
.m-row{display:flex;align-items:center;gap:3.4cqw;margin:2.4cqw 5cqw;padding:4.6cqw 4.4cqw;border-radius:4cqw;background:rgba(255,255,255,.06);cursor:pointer}.m-ck{width:5.4cqw;height:5.4cqw;border-radius:50%;border:1.4px solid rgba(255,255,255,.4);flex:none;transition:.3s}.m-row.on .m-ck{background:var(--lime);border-color:var(--lime)}.m-row b{font-weight:500;font-size:4.2cqw;flex:1}.m-row em{font-size:3.6cqw;color:var(--mute);font-style:normal}.m-row.on b{opacity:.55;text-decoration:line-through}
.bub{margin:3cqw 5cqw;max-width:80%;padding:4cqw 4.6cqw;border-radius:4cqw;font-size:4.2cqw;line-height:1.4}.bub.b{background:rgba(255,255,255,.1);border-bottom-left-radius:1cqw}.bub.u{margin-left:auto;background:var(--lime);color:var(--ink)}
.chips{display:flex;gap:2cqw;margin:2cqw 5cqw;flex-wrap:wrap}.chips span{padding:2.6cqw 4cqw;border-radius:9cqw;border:1px solid rgba(215,242,74,.5);font-size:3.8cqw;color:var(--lime)}
.d-side{position:absolute;left:0;top:0;bottom:0;width:15cqw;background:#101110;border-right:1px solid rgba(255,255,255,.08);padding:4cqw 2.2cqw;display:grid;gap:2.2cqw;align-content:start;grid-auto-rows:min-content}.d-side i{display:block;height:1.9cqw;border-radius:2cqw;background:rgba(255,255,255,.12)}.d-side i:first-child{background:var(--lime);width:60%}
.d-main{position:absolute;left:15cqw;right:0;top:0;bottom:0;padding:3cqw 3.4cqw;display:grid;gap:2.4cqw;align-content:start;grid-auto-rows:min-content}.d-top{display:flex;justify-content:space-between;align-items:center}.d-top b{font:500 2.2cqw Inter}.d-top span{font-size:1.5cqw;color:var(--lime);letter-spacing:.14em;text-transform:uppercase}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw}.kp div{padding:1.8cqw;border-radius:1.4cqw;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}.kp b{display:block;font:400 3.6cqw IS;color:var(--lime)}.kp span{font-size:1.4cqw;color:var(--mute)}
.ch{display:flex;align-items:flex-end;gap:1.2cqw;height:12cqw;padding:1.6cqw;border-radius:1.4cqw;background:rgba(255,255,255,.05)}.ch u{flex:1;background:linear-gradient(var(--lime),rgba(215,242,74,.25));border-radius:.5cqw .5cqw 0 0;display:block}
.tb div{display:grid;grid-template-columns:2fr 1fr 1fr;gap:1cqw;padding:1.3cqw 1.6cqw;font-size:1.5cqw;border-top:1px solid rgba(255,255,255,.07);color:rgba(243,239,230,.8)}.tb em{font-style:normal;color:var(--lime)}
.cm{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw}.cm div{border-radius:1.4cqw;background:rgba(255,255,255,.06);padding:1.6cqw;font-size:1.5cqw}.cm i{display:block;aspect-ratio:16/9;border-radius:1cqw;margin-bottom:1.2cqw;background:radial-gradient(circle at 30% 30%,rgba(215,242,74,.4),rgba(40,44,30,.6))}.cm b{display:block;font-weight:500;margin-bottom:.8cqw}.cm .pg{height:.7cqw;border-radius:9cqw;background:rgba(255,255,255,.14)}.cm .pg u{display:block;height:100%;background:var(--lime);border-radius:9cqw}
.wb{display:flex;align-items:center;gap:1.2cqw;padding:1.5cqw 2cqw;background:#161714;border-bottom:1px solid rgba(255,255,255,.08)}.wb i{width:1.2cqw;height:1.2cqw;border-radius:50%;background:rgba(255,255,255,.2)}.wb span{margin-left:2cqw;font-size:1.4cqw;color:var(--mute);background:rgba(255,255,255,.06);padding:.5cqw 2cqw;border-radius:9cqw}
.wh{padding:5cqw;position:relative}.wh small{font-size:1.5cqw;letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}.wh b{display:block;font-size:6.4cqw;line-height:1;margin:1.6cqw 0 2.6cqw;max-width:55%;font-family:IS;font-weight:400}.wbt{display:flex;gap:1.4cqw}.wbt u{text-decoration:none;font-size:1.6cqw;padding:1.2cqw 2.6cqw;border-radius:9cqw;background:var(--lime);color:#070707;font-weight:500}.wbt u.o{background:none;color:var(--paper);border:1px solid rgba(255,255,255,.3)}
.wimg{position:absolute;right:5cqw;top:5cqw;width:34cqw;height:30cqw;border-radius:2cqw;background:radial-gradient(circle at 30% 30%,rgba(215,242,74,.55),rgba(32,36,22,.9) 70%);border:1px solid rgba(255,255,255,.12)}
.sw{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center;padding:4cqw}.sw svg{width:56%;margin-bottom:-6cqw}.sw b{display:block;font:italic 400 8.4cqw IS;color:var(--lime);line-height:1}.sw span{display:block;margin-top:1.6cqw;font-size:2.2cqw;color:var(--mute);max-width:60%}


.ws{background:var(--bg);color:var(--fg,#f3efe6);--mu:rgba(243,239,230,.62);--bd:rgba(255,255,255,.1);--cd:rgba(255,255,255,.05);--on:#070707}
.ws-burger{--bg:radial-gradient(120% 90% at 85% 30%,#3a1d0a,#150b05 60%);--ac:#ff8a2a;--cd:rgba(255,138,42,.08);--bd:rgba(255,138,42,.2)}
.ws-cars{--bg:radial-gradient(120% 90% at 80% 35%,#2a1013,#0c0d0f 62%);--ac:#e5412d;--on:#fff}
.ws-ride{--bg:radial-gradient(120% 90% at 80% 35%,#2e1808,#0d0c0b 62%);--ac:#ff6a1f;--on:#120700}
.ws-bloom{--bg:#f1eee5;--fg:#16241b;--mu:rgba(22,36,27,.62);--ac:#2f7a4a;--on:#fff;--cd:#fff;--bd:rgba(22,36,27,.12)}
